name: Release

# A release is cut only when the owner promotes a main SHA to the deploy branch
# (scripts/promote.sh, design-system#179, docs/deploy-branch.md). A push to main
# runs Test and nothing else.
#
# The shared release pattern (argus-config#1167, design-system#191): one workflow, a
# push to deploy, and two jobs in order. `Test before release (...)` runs the gates on
# the promoted SHA, named for what it runs so the Actions page reads as a sentence.
# `Release` needs it, so a red test means no version (design-system#159: v3.6.3 was
# published from a head whose Test run failed, when the two were separate workflows).
#
# There is no workflow_run trigger. GitHub reports that event's branch as the default
# branch, and semantic-release (env-ci) reads its branch from there: it silently dry-ran
# (design-system#190). On a push to deploy GITHUB_REF is deploy, so nothing overrides it.
#
# This file is read from the pushed SHA, so a change here acts at the next promotion.
on:
  push:
    branches: [deploy]
  # By hand, from deploy only: the first job refuses any other ref.
  workflow_dispatch:

# One Release at a time, queued rather than cancelled. Every run releases from
# the tip of deploy (see the checkout below), so when GitHub drops an older pending
# run in favour of a newer one, the newer run sees every commit the older would
# have. A release lands its commits on main, which agents also push to, so two runs
# would otherwise race each other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Every step of scripts/check.sh (component tests, design detector, registry drift, lint)
  # plus the curve geometry gate, all of them on every promotion (design-system#197: the
  # job that lands the version bump on main runs the full local check first). The
  # detector and drift steps repeat design.yml and check.sh, and their pins must match
  # both (test/release-gate.test.ts). The geometry gate is not skipped by an
  # unchanged-inputs filter here: the geometry gate is not skipped by an unchanged-inputs filter
  # here, because this run is what Release trusts. One job, one install, so a homelab
  # runner that takes one job at a time does it once. Keep the commands in step with
  # test.yml; test/release-gate.test.ts fails when they drift.
  test:
    name: Test before release (component tests, design detector, registry drift, curve geometry gate, lint)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - name: Refuse a run from any ref but deploy
        if: github.ref != 'refs/heads/deploy'
        run: |
          echo "::error::Release runs from deploy only, this run is on ${GITHUB_REF}. Promote a main SHA with scripts/promote.sh instead."
          exit 1

      # github.sha: the commit that was promoted (or the tip of deploy for a manual run).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Pinned as in design.yml and scripts/check.sh.
      - name: Detect UI anti-patterns
        run: npx --yes impeccable@3.6.1 detect registry/ theme/

      # Rebuild r/ and fail on a stale file or an untracked one, exactly as check.sh does:
      # git diff alone cannot see an r/ file the build created and nobody added.
      - name: Rebuild per-item output and fail if it drifted
        run: |
          npx --yes shadcn@4.19.1 build --output ./r
          if ! git diff --quiet -- r/ || [ -n "$(git ls-files --others --exclude-standard -- r/)" ]; then
            echo "::error::r/ is out of date. Run 'npx shadcn@4.19.1 build --output ./r' and commit the result."
            git status --short -- r/
            exit 1
          fi
          echo "r/ matches registry.json and the current sources."

      # Chromium is downloaded once and reused by every later run (design-system#158),
      # exactly as in test.yml: outside the workspace, never asking for OS packages.
      - name: Point Playwright at a persistent browser directory
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CORE_VERSION=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_ENV"

      - name: Restore Chromium
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-playwright-core-${{ env.PLAYWRIGHT_CORE_VERSION }}

      - name: Install Chromium
        run: pnpm exec playwright-core install chromium

      - name: Run the geometry gate
        run: pnpm gate:geometry

      - name: Upload curve screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-gate-curves
          path: geometry-gate-out/curves/
          if-no-files-found: ignore

      # Errors fail the job; warnings are reported only.
      - name: Run oxlint
        run: pnpm lint

  release:
    name: Release
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of deploy, not github.sha: a run that queued behind another
          # promotion would otherwise start behind the remote and release nothing.
          ref: deploy
          fetch-depth: 0
          persist-credentials: false

      # The checkout above is the tip of deploy, which may be newer than the SHA the
      # test job went green on. Release only if that SHA is still the newest real
      # commit; a newer promotion gets its own run, tests and Release.
      - name: Check the tested SHA is the head of deploy
        id: gate
        run: bash scripts/release/tested-head.sh "${TESTED_SHA}" >> "${GITHUB_OUTPUT}"
        env:
          TESTED_SHA: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.release == 'true' && runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: steps.gate.outputs.release == 'true' && runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # Up to 3 attempts, each from the remote tip of deploy; see the script. The
      # release never pushes deploy: it tags a stamped commit and lands the version
      # bump on main (semantic-release-pin.mjs), and the catch-up makes the previous
      # release's tag visible when the promoted SHA sits below where it landed.
      - name: Release
        if: steps.gate.outputs.release == 'true'
        run: bash scripts/release/release-with-retry.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: deploy
          CATCH_UP_FROM: main
