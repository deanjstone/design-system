name: Release

# A release is cut only when the owner promotes a main SHA to the deploy branch
# (scripts/promote.sh, design-system#179, docs/deploy-branch.md). A push to main
# runs Test and nothing else.
#
# The shared release pattern (argus-config#1167, design-system#191, #203): one workflow, a
# push to deploy, and two jobs in order. `Test before release (...)` first asks whether
# anything would ship (scripts/release/release-needed.sh): with no feat, fix, perf,
# revert or breaking commit since the last tag the run ends green with no test and no
# version. Otherwise it runs the gates on the promoted SHA, named for what it runs so the
# Actions page reads as a sentence. `Release` needs it, so a red test means no version
# (design-system#159: v3.6.3 was published from a head whose Test run failed, when the
# two were separate workflows).
#
# The release commits nothing: it tags the promoted SHA and publishes the GitHub
# release, so the tag is on `deploy` and `main` gains no bot commit. CHANGELOG.md is
# frozen at 3.24.0; the GitHub release notes carry the history.
#
# There is no workflow_run trigger. GitHub reports that event's branch as the default
# branch, and semantic-release (env-ci) reads its branch from there: it silently dry-ran
# (design-system#190). On a push to deploy GITHUB_REF is deploy, so nothing overrides it.
#
# This file is read from the pushed SHA, so a change here acts at the next promotion.
on:
  push:
    branches: [deploy]
  # By hand, from deploy only: the first job refuses any other ref.
  workflow_dispatch:

# One Release at a time, queued rather than cancelled. When GitHub drops an older
# pending run in favour of a newer one, the newer run sees every commit the older
# would have, because a release covers everything since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # The pre-check runs first: a promotion with nothing releasable costs no test and
  # no version. Then every step of scripts/check.sh (component tests, design detector, registry drift, lint)
  # plus the curve geometry gate, all of them on every releasable promotion
  # (design-system#197: the job that gates a version runs the full local check). The
  # detector and drift steps repeat design.yml and check.sh, and their pins must match
  # both (test/release-gate.test.ts). The geometry gate is not skipped by an
  # unchanged-inputs filter here: the geometry gate is not skipped by an unchanged-inputs filter
  # here, because this run is what Release trusts. One job, one install, so a homelab
  # runner that takes one job at a time does it once. Keep the commands in step with
  # test.yml; test/release-gate.test.ts fails when they drift.
  test:
    name: Test before release (component tests, design detector, registry drift, curve geometry gate, lint)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
    outputs:
      releasable: ${{ steps.precheck.outputs.releasable }}
    steps:
      - name: Refuse a run from any ref but deploy
        if: github.ref != 'refs/heads/deploy'
        run: |
          echo "::error::Release runs from deploy only, this run is on ${GITHUB_REF}. Promote a main SHA with scripts/promote.sh instead."
          exit 1

      # github.sha: the commit that was promoted (or the tip of deploy for a manual run).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # The pre-check reads every commit since the last tag.
          fetch-depth: 0

      - name: Anything to release?
        id: precheck
        run: bash scripts/release/release-needed.sh

      - uses: pnpm/action-setup@v4
        if: steps.precheck.outputs.releasable == 'true' && runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: steps.precheck.outputs.releasable == 'true' && runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        if: steps.precheck.outputs.releasable == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.precheck.outputs.releasable == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.precheck.outputs.releasable == 'true'
        run: pnpm test

      # Pinned as in design.yml and scripts/check.sh.
      - name: Detect UI anti-patterns
        if: steps.precheck.outputs.releasable == 'true'
        run: npx --yes impeccable@3.6.1 detect registry/ theme/

      # Rebuild r/ and fail on a stale file or an untracked one, exactly as check.sh does:
      # git diff alone cannot see an r/ file the build created and nobody added.
      - name: Rebuild per-item output and fail if it drifted
        if: steps.precheck.outputs.releasable == 'true'
        run: |
          npx --yes shadcn@4.19.1 build --output ./r
          if ! git diff --quiet -- r/ || [ -n "$(git ls-files --others --exclude-standard -- r/)" ]; then
            echo "::error::r/ is out of date. Run 'npx shadcn@4.19.1 build --output ./r' and commit the result."
            git status --short -- r/
            exit 1
          fi
          echo "r/ matches registry.json and the current sources."

      # Chromium is downloaded once and reused by every later run (design-system#158),
      # exactly as in test.yml: outside the workspace, never asking for OS packages.
      - name: Point Playwright at a persistent browser directory
        if: steps.precheck.outputs.releasable == 'true'
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CORE_VERSION=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_ENV"

      - name: Restore Chromium
        if: steps.precheck.outputs.releasable == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-playwright-core-${{ env.PLAYWRIGHT_CORE_VERSION }}

      - name: Install Chromium
        if: steps.precheck.outputs.releasable == 'true'
        run: pnpm exec playwright-core install chromium

      - name: Run the geometry gate
        if: steps.precheck.outputs.releasable == 'true'
        run: pnpm gate:geometry

      - name: Upload curve screenshots
        if: failure() && steps.precheck.outputs.releasable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geometry-gate-curves
          path: geometry-gate-out/curves/
          if-no-files-found: ignore

      # Errors fail the job; warnings are reported only.
      - name: Run oxlint
        if: steps.precheck.outputs.releasable == 'true'
        run: pnpm lint

  release:
    name: Release
    needs: test
    # Nothing releasable: the test job ended green having run nothing, and there is no version.
    if: needs.test.outputs.releasable == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of deploy, not github.sha: semantic-release releases only a branch
          # that is level with the remote, and the gate below proves the tip is the
          # tested SHA, so the tag lands on the promoted commit.
          ref: deploy
          fetch-depth: 0
          persist-credentials: false

      # The tip of deploy may be newer than the SHA the test job went green on. Release
      # only if that SHA is still the tip; a newer promotion gets its own run, tests and
      # Release, and that release covers every commit since the last tag.
      - name: Check the tested SHA is the tip of deploy
        id: gate
        run: bash scripts/release/tested-head.sh "${TESTED_SHA}" >> "${GITHUB_OUTPUT}"
        env:
          TESTED_SHA: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.release == 'true' && runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: steps.gate.outputs.release == 'true' && runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.release == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # semantic-release picks the version, creates the vX.Y.Z tag on the promoted SHA and
      # publishes the GitHub release (.releaserc.json). It pushes no commit to deploy or
      # main: deploy stays a fast-forward of main, and main gains nothing.
      - name: Release
        if: steps.gate.outputs.release == 'true'
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
