name: Test

on:
  pull_request:
  # deploy too: the Release workflow starts from a green Test run on the promoted SHA
  # (design-system#179), so a promotion re-runs the checks on exactly what it releases.
  push:
    branches: [main, deploy]

# A pull request's newer push replaces its older run. A push to main or deploy gets a
# group of its own (its SHA), so it is never cancelled and never dropped from a queue:
# every trunk SHA gets a verdict, and Release starts from the deploy one (design-system#184).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the ~4.5 minute geometry gate has to run: only when a file it reads
  # changed in this push or pull request, and always on a push to deploy. The rule and
  # the file list are in scripts/ci/geometry-inputs-changed.sh.
  changes:
    name: Geometry gate inputs changed
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      geometry: ${{ steps.filter.outputs.geometry }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the gate's inputs
        id: filter
        run: bash scripts/ci/geometry-inputs-changed.sh "${BASE_SHA}" "${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    name: Component tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  geometry:
    name: Curve geometry gate
    needs: changes
    if: needs.changes.outputs.geometry == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium is downloaded once and reused by every later run (design-system#158).
      # The browsers live outside the job workspace so checkout cleanup cannot
      # remove them. A self-hosted runner keeps the directory on its host; a
      # GitHub-hosted one restores it from actions/cache. Either way the install
      # below only downloads when this playwright-core revision is missing. It
      # never asks Playwright to install OS packages: that needs root, and those
      # are not CI's to install.
      - name: Point Playwright at a persistent browser directory
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CORE_VERSION=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_ENV"

      - name: Restore Chromium
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-playwright-core-${{ env.PLAYWRIGHT_CORE_VERSION }}

      - name: Install Chromium
        run: pnpm exec playwright-core install chromium

      - name: Run the geometry gate
        run: pnpm gate:geometry

      - name: Upload curve screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-gate-curves
          path: geometry-gate-out/curves/
          if-no-files-found: ignore

  lint:
    name: Lint (oxlint)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted'

      - name: Use the host pnpm (self-hosted)
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/host-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Errors fail the job; warnings are reported only.
      - name: Run oxlint
        run: pnpm lint
