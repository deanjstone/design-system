name: Design check

# Two checks on the UI files a PR changes. Shipped by the design-system
# `design-check` registry item.
#   - Impeccable's design detector. It runs no AI model: it flags low contrast,
#     AI-slop patterns and drift from DESIGN.md. Findings are written to the job
#     summary and never block a merge.
#   - The design rules (scripts/design-rules.mjs): iPhone safe-area and touch rules,
#     such as min-h-screen, a missing viewport-fit=cover, fixed elements with no
#     safe edge, a bare env(safe-area-inset-left|right), and form text under 16px.
#     A finding fails the job. A line that is right for a reason the rule cannot
#     see takes a `design-rules-ignore` comment.

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.css'
      - '**/*.html'
      - '**/*.vue'
      - '**/*.svelte'
      - 'DESIGN.md'
      - 'components.json'
      - '.impeccable/**'
      - 'scripts/design-detect.sh'
      - 'scripts/design-rules.mjs'
      - '.github/workflows/design-detect.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      # The script diffs against the base commit, so the history back to it is needed;
      # blob:none keeps that to commits and trees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # continue-on-error: the detector exits 2 on findings and 1 when a target could
      # not be scanned. Either shows as a failed step here, never as a failed check.
      # Run through bash: `shadcn add` does not set the executable bit.
      - name: Run the detector on changed UI files
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/design-detect.sh "$BASE_SHA"

      # No continue-on-error: this one blocks. It reads only the files the PR changed.
      - name: Check the design rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/design-rules.mjs "$BASE_SHA"
